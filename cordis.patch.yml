# dsh-botplugin 作为 profile 层的接线。
#
# 这个文件的存在意义：让「装上 = 生效」。
# 只把它当普通依赖装进 profile 时，DSH 不会激活它 ——
# 实测原话：「dsh-botplugin declares no dsh.bundle — installed as a plain
# dependency, not a profile layer」。所以 package.json 里必须有
# dsh.bundle.patch 指向本文件，本文件再 insert 出真正的插件行。
#
# ⚠️ 用 insert 而不是顶层 - id: botplugin：
#    insert 是「新增一行」，天然不覆盖别人；顶层同名 id 是「整体替换」，
#    会把已有那行的 config 冲掉（REPLACE 不深合并）。用户自己也会写
#    - id: botplugin 来填自己的 token，本文件只提供默认装配。
#
# ⚠️ 这里刻意只给最小 config：
#    token 属于用户机密，绝不能写进包里；用户在自己的
#    cordis.patch.yml 里写 - id: botplugin / config: {...} 覆盖即可。

- insert:
    - id: botplugin
      name: dsh-botplugin
      config: {}
